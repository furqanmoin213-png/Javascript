<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clock + File Picker</title>
    <style>
        body { font-family: Arial; padding: 20px; }
        img { max-width: 200px; margin-top: 10px; display: block; }
        iframe { width: 80vw; height: 100vh; margin-top: 10px; 
        
            margin: 10px auto;

        }
        iframe #toolbar{
            display: none;
        }
        
    </style>
</head>
<body>

    <h2>Live Clock</h2>
    <p id="clock"></p>

    <h2>Pick and Display File</h2>
    <input type="file" id="fileInput">

    <div id="preview"></div>
<script src="https://unpkg.com/mammoth/mammoth.browser.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
    // ✅ LIVE CLOCK (auto updates every second)
    function updateClock() {
        const now = new Date();

        let h = String(now.getHours()).padStart(2, '0');
        let m = String(now.getMinutes()).padStart(2, '0');
        let s = String(now.getSeconds()).padStart(2, '0');

        document.getElementById("clock").innerText = `${h}:${m}:${s}`;
    }

    setInterval(updateClock, setTimeout(1000));
    updateClock(); // run once immediately

    // ✅ FILE PICKER + DISPLAY
    const input = document.getElementById("fileInput");
    const preview = document.getElementById("preview");
    
    input.addEventListener("change", function () {
        const file = this.files[0];
        preview.innerHTML = ""; // clear previous

        if (!file) return;

        const fileURL = URL.createObjectURL(file);

        // 📸 IMAGE
        if (file.type.startsWith("image/")) {
            const img = document.createElement("img");
            img.src = fileURL;
            preview.appendChild(img);
        }

        // 📄 PDF
        else if (file.type === "application/pdf") {
            const iframe = document.createElement("iframe");
            iframe.src = fileURL;
            preview.appendChild(iframe);
        }
   else if (file.name.endsWith(".xlsx")) {
    const reader = new FileReader();

    reader.onload = function (e) {
        const data = new Uint8Array(e.target.result);
        const workbook = XLSX.read(data, { type: "array" });

        let html = "";

        workbook.SheetNames.forEach(sheetName => {
            const sheet = workbook.Sheets[sheetName];
            html += XLSX.utils.sheet_to_html(sheet);
        });

        preview.innerHTML = html;
    };

    reader.readAsArrayBuffer(file);
}
else if (file.name.endsWith(".docx")) {
    const reader = new FileReader();

    reader.onload = function (event) {
        mammoth.convertToHtml({ arrayBuffer: event.target.result })
            .then(function (result) {
                preview.innerHTML = result.value;
            });
    };

    reader.readAsArrayBuffer(file);
}

        // 📁 OTHER FILES
        else {
            const p = document.createElement("p");
            p.textContent = "File selected: " + file.name;
            preview.appendChild(p);
        }
    });
</script>

</body>
</html>
